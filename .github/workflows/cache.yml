name: Cache
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    steps:
      - run: gh release view "$TAG" || gh release create "$TAG" --prerelease --title "LibreOffice build cache" --notes "Built LibreOffice, named by what went into it. Read by cmake/ports/libreoffice when LIBREOFFICE_CACHE is set."
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: libreoffice-cache
  pack:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: x64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: ia32
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm
            flags: -D ANDROID_STL=c++_shared
          - os: macos-14
            platform: darwin
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-14
            platform: ios
            arch: arm64
          - os: macos-14
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-14
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-11-vs2026-arm
            platform: win32
            arch: arm64
            flags: -D LIBREOFFICE_VISUAL_STUDIO=2026
    runs-on: ${{ matrix.os }}
    name: Pack / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: sudo apt install gperf nasm
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: brew install autoconf automake libtool make gperf
        if: ${{ matrix.platform == 'darwin' || matrix.platform == 'ios' }}
      - run: choco install msys2
        if: ${{ matrix.platform == 'win32' }}
      - run: pacman --noconfirm -S make autoconf automake libtool gettext gettext-devel pkgconf python gperf nasm bison flex zip unzip patch
        shell: C:\tools\msys64\usr\bin\bash.exe -e {0}
        env:
          PATH: C:\tools\msys64\usr\bin
        if: ${{ matrix.platform == 'win32' }}
      - run: git config --global core.autocrlf false
        if: ${{ matrix.platform == 'win32' }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }}
          tags: ${{ matrix.tags }}
      - run: bare-make build --target libreoffice_pack
      - run: gh release upload "$TAG" build/libreoffice-*.tar.xz --clobber
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: libreoffice-cache
  prune:
    runs-on: ubuntu-latest
    needs: pack
    name: Prune
    steps:
      - run: |
          cat > prune.py <<'EOF'
          import re, sys
          from collections import defaultdict

          # Every target keys its own archive, so the newest per target is what a
          # build asks for. One older key survives so a branch that has not
          # rebased yet keeps hitting.
          keep = 2
          seen = defaultdict(list)

          for line in sys.stdin:
              name, created = line.rstrip("\n").split("\t")
              match = re.fullmatch(r"libreoffice-(.+)-([0-9a-f]{16})\.tar\.xz", name)
              if match:
                  seen[match.group(1)].append((created, name))

          for archives in seen.values():
              for _, name in sorted(archives, reverse=True)[keep:]:
                  print(name)
          EOF

          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .createdAt] | @tsv' > assets.tsv

          python3 prune.py < assets.tsv > stale.txt

          while read -r name; do
            echo "removing $name"
            gh release delete-asset "$TAG" "$name" --yes
          done < stale.txt
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: libreoffice-cache
